name: Mise à jour automatique Footsure

on:
  schedule:
    # Tous les jours à 05:00 UTC (06:00 WAT)
    - cron: '0 5 * * *'
  workflow_dispatch: # permet de lancer manuellement aussi

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer les prédictions du jour
        run: |
          node << 'EOF'
          const fs = require('fs');
          const today = new Date().toISOString().slice(0, 10);

          // Templates de raisonnement style Grok (facteurs + imprévus)
          const templates = [
            {
              competition: "Premier League / Championship",
              prediction: "1X ou Victoire domicile",
              confidence: "Moyenne-Élevée",
              score: "1-0 / 2-1",
              factors: ["Forme domicile solide", "Adversaire en difficulté à l'extérieur", "Motivation élevée"],
              risks: ["Rotation d'effectif", "Carton rouge", "But sur set-piece", "Arbitrage strict"]
            },
            {
              competition: "La Liga / Serie A",
              prediction: "Double chance 1X",
              confidence: "Élevée",
              score: "1-1 / 1-0",
              factors: ["Solide à domicile", "Adversaire irrégulier", "Historique favorable"],
              risks: ["Fatigue calendrier", "Changement tactique", "But sur corner", "Pression"]
            },
            {
              competition: "Bundesliga / Ligue 1",
              prediction: "Plus de 2.5 buts",
              confidence: "Moyenne",
              score: "2-1 / 2-2",
              factors: ["Deux équipes offensives", "Défenses fragiles récemment", "Match ouvert"],
              risks: ["Rotation", "But annulé", "Match fermé si but tôt", "Carton"]
            },
            {
              competition: "Champions League / Europa",
              prediction: "Victoire domicile",
              confidence: "Moyenne-Élevée",
              score: "2-0 / 2-1",
              factors: ["Avantage domicile", "Expérience européenne", "Motivation qualification"],
              risks: ["Météo", "But rapide adverse", "Arbitrage", "Pression psychologique"]
            }
          ];

          // Génération simple et transparente (pas d'IA payante)
          const predictions = templates.map((t, i) => ({
            competition: t.competition,
            home: ["Équipe A", "Équipe B", "Équipe C", "Équipe D"][i],
            away: ["Adversaire 1", "Adversaire 2", "Adversaire 3", "Adversaire 4"][i],
            kickoff: ["15:00", "17:30", "20:00", "20:45"][i],
            prediction: t.prediction,
            confidence: t.confidence,
            score: t.score,
            factors: t.factors,
            risks: t.risks,
            ultimate: i === 0
          }));

          // Conserve l'historique existant + ajoute une entrée du jour
          let history = [];
          try {
            const old = JSON.parse(fs.readFileSync('data/predictions.json', 'utf8'));
            history = (old.history || []).slice(0, 12);
          } catch(e) {}

          history.unshift({
            date: today,
            match: "Mise à jour automatique",
            pred: "Système",
            result: "-",
            status: "OK"
          });

          const data = {
            updated: today,
            predictions,
            history
          };

          fs.writeFileSync('data/predictions.json', JSON.stringify(data, null, 2));
          console.log("Prédictions mises à jour pour", today);
          EOF

      - name: Commit et push
        run: |
          git config user.name "Footsure Bot"
          git config user.email "bot@footsure.local"
          git add data/predictions.json
          git diff --staged --quiet || git commit -m "Auto update $(date +%Y-%m-%d)"
          git push
